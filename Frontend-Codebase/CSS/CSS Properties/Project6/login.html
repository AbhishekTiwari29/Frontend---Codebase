<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <!-- Login Section -->
  <div class="login">

    <h2>Login</h2>

    <form>
      <input type="text" placeholder="Username"><br><br>
      <input type="password" placeholder="Password"><br><br>
      <button type="submit">Login</button>
    </form>

  </div>

  <!-- Dashboard Section -->
  <div class="dashboard">

    <header>
      <h1>Dashboard</h1>
    </header>

    <div class="container">

      <aside>
        <p>Menu</p>
        <ul>
          <li>Home</li>
          <li>Profile</li>
          <li>Settings</li>
        </ul>
      </aside>

      <main>

        <div class="cards">

          <div class="card">
            <h3>Users</h3>
            <p>120</p>
          </div>

          <div class="card">
            <h3>Sales</h3>
            <p>80</p>
          </div>

          <div class="card">
            <h3>Orders</h3>
            <p>45</p>
          </div>

        </div>

      </main>

    </div>

  </div>

</body>
</html>
